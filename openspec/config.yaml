schema: spec-driven

context: |
  Tech stack: Next.js 16, Prisma 6, Supabase, Tailwind 4.
  Architecture: App Router (src/app), basic feature-sliced (components, lib, utils).
  Database: Supabase (Auth/Storage) + Prisma (ORM).
  Styling: Tailwind CSS 4.

strict_tdd: false # Vitest disponible; ver nota en AGENTS.md antes de activarlo.

# NOTA: el schema `spec-driven` sólo conoce los artifacts `proposal`, `specs`,
# `design` y `tasks`. Cualquier otra clave acá dentro se descarta con warning.
# Las convenciones de apply / verify / archive viven en AGENTS.md.
rules:
  proposal:
    - "Include database schema changes in the proposal."
    - "Identify if Supabase migrations are needed."
  specs:
    - "Use Given/When/Then format for scenarios."
    - "Document specific Supabase edge cases (auth, RLS)."
  design:
    - "Detail Prisma schema updates."
    - "Include UI component breakdown (Atomic Design or similar)."
  tasks:
    - "Group by DB/Prisma, then Supabase, then Backend, then Frontend."
    - "Follow Next.js 16 patterns: Server Components by default, strict type safety."

testing:
  runner: vitest
  command: npx vitest run
  layers:
    unit: true
    integration: false
    e2e: false
